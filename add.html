<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a friend on Foodie</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
         background: Canvas; color: CanvasText; text-align: center; }
  main { max-width: 340px; padding: 32px 24px; }
  .face { width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 40px; font-weight: 700; color: white;
          background: linear-gradient(135deg, #ff9500, #ff2d55); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: GrayText; line-height: 1.4; }
  a.button { display: block; padding: 15px; border-radius: 999px; background: #ff2d55;
             color: white; font-weight: 600; font-size: 17px; text-decoration: none; }
  .small { margin-top: 20px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="face" id="face">F</div>
  <h1 id="title">Add a friend on Foodie</h1>
  <p id="detail">Share what you're cooking, and see what they make.</p>
  <a class="button" id="open" href="foodieapp://">Open in Foodie</a>
  <p class="small">Don't have Foodie yet? It's in beta: ask whoever sent this for an invite, then tap the link again.</p>
</main>
<script>
  // ?u=finn → foodieapp://add/finn. Only what could be a username (as the app checks too).
  var name = (new URLSearchParams(location.search).get("u") || "").toLowerCase().replace(/^@/, "");
  if (/^[a-z0-9_.]{3,20}$/.test(name) && !/^\.|\.$/.test(name)) {
    var link = "foodieapp://add/" + encodeURIComponent(name);
    document.getElementById("open").href = link;
    document.getElementById("title").textContent = "@" + name + " invited you to Foodie";
    document.getElementById("face").textContent = name.charAt(0).toUpperCase();
    // With Foodie installed, Safari offers to open it straight away
    location.href = link;
  }
</script>
</body>
</html>
